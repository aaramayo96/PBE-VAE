[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbe-vae"
version = "1.0.0"
description = "Probability Based Expert Variational Autoencoder Package"
readme = "README.md"
authors = [{ name = "" }]
license = {  }
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "scikit-learn>=1.2.0",
    "pyyaml>=6.0",
    "pyproj>=3.4.0",
    "tqdm>=4.64.0",
    "joblib>=1.2.0",
    "matplotlib>=3.6.0",
    "pandas>=1.5.0",
    "spectral>=0.23.1",
]

[project.scripts]
pbe-vae = "pbe_vae.cli.main:main"
