model: "configs/models/pbe_vae_standard.yaml"

classifier:
  model: "hist_gradient_boosting"
  n_estimators: 200
  learning_rate: 0.05
  max_depth: 4
  subsample: 0.8
  min_samples_leaf: 5
  calibration: "isotonic"
  max_cv_splits: 5

training:
  epochs: 100
  batch_size: 4096

processing:
  roi_radius_meters: 100
  target_crs: "EPSG:32611"
  latent_dim: 5
  n_clusters: 20
  probability_method: "gmm"
  vnir_range: [0.38, 1.20]
  swir_range: [2.00, 2.50]
  excluded_wavelength_ranges:
    - [1.30, 1.50]
    - [1.75, 2.00]
  single_cluster_activation: "sigmoid"
  single_cluster_temperature: 1.0
  single_cluster_offset: 0.0
  curvature_threshold: 4.5
  use_dem: true
  dem_weight: 0.75
  dem_weight_ratio: 0.75
  dem_integration: "spectral_gate"
  dem_similarity_width: 1.0
  background_sample_ratio: 1.0
  background_max_pixels: 50000
  background_max_flightlines: 40
  background_negative_weight: 0.5

discovery:
  conf_threshold: 0.75
  probability_tiers: [0.75, 0.80, 0.90, 0.95]
  min_cluster_pixels: 500
  max_cluster_pixels: 50000
  opening_kernel: 11
  min_mean_probability: 0.75
  min_compactness: 0.03
  candidate_sort: "max_prob"
  dedup_radius_pixels: 80
  max_candidates_per_tile: 2000
  detected_roi_size_pixels: [200, 200]
  roi_window_max_multiple: 5
  min_roi_coverage: 0.01
  save_individual_reports: false

runtime:
  prediction_workers: 4
  prediction_device: "cpu"
  threads_per_worker: 1

paths:
  base_dir:
    - "/Volumes/HSC/ARIZONA_FULL/flightlines"
  out_dir: "/Users/hsc/Documents/ARIZONA_HS/pbe_vae_aml_standard_detected_roi"
  dem_path: "/Volumes/HSC/ARIZONA_FULL/DEM/10m_usgs_dem_arizona.tif"
